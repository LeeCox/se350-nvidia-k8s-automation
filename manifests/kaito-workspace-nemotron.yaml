# KAITO Workspace for NVIDIA Nemotron 3 Nano 4B - the agentic/tool-calling model that fits the
# A2's 16GB VRAM. Nemotron 3.5 Lightning (30B-A3B) does NOT fit here - NVIDIA's own hardware
# matrix requires a single A100/H100-class GPU minimum, well beyond the A2.
# This is a curated KAITO preset with A2-specific vLLM tuning and tool-call parsing below.
#
# Apply with: bash scripts/deploy-kaito-model.sh
# (or manually: envsubst < manifests/kaito-workspace-nemotron.yaml | kubectl apply -f -)
#
# If Hugging Face ever gates this model for your account, add a modelAccessSecret:
#   kubectl create secret generic hf-token --from-literal=token=<your_hf_token>
# then add under inference.preset:
#   presetOptions:
#     modelAccessSecret: hf-token
# The A2 has ~14.6GB usable VRAM and very few SMs. vLLM's default CUDA-graph capture (built for
# datacenter GPUs) eats enough extra memory on top of the 7.4GB BF16 weights to OOM before the
# KV cache can even be allocated - enforce-eager skips graph capture entirely to fit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${KAITO_WORKSPACE_NAME}-tuning
data:
  inference_config.yaml: |
    vllm:
      enforce-eager: true
      gpu-memory-utilization: 0.85
      max-model-len: 8192
      max-num-seqs: 4
      tool-call-parser: qwen3_coder
      additional-config: '{"enable_auto_tool_choice": true}'
---
apiVersion: kaito.sh/v1beta1
kind: Workspace
metadata:
  name: ${KAITO_WORKSPACE_NAME}
resource:
  labelSelector:
    matchLabels:
      ${KAITO_NODE_LABEL_KEY}: ${KAITO_NODE_LABEL_VALUE}
inference:
  preset:
    name: ${KAITO_MODEL_PRESET}
  config: ${KAITO_WORKSPACE_NAME}-tuning
