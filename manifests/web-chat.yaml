apiVersion: v1
kind: Namespace
metadata:
  name: web-chat
  labels:
    app.kubernetes.io/name: web-chat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-chat
  namespace: web-chat
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-chat-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-chat-pod-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-chat-pod-reader
subjects:
  - kind: ServiceAccount
    name: web-chat
    namespace: web-chat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-chat
  namespace: web-chat
  labels:
    app.kubernetes.io/name: web-chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-chat
    spec:
      serviceAccountName: web-chat
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-chat
          image: localhost/web-chat:production
          imagePullPolicy: Never
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-chat-auth
                  key: token
            - name: NEMOTRON_BASE_URL
              value: http://workspace-nemotron-3-nano-4b.default.svc.cluster.local/v1
            - name: NEMOTRON_MODEL
              value: nvidia-nemotron-3-nano-4b-bf16
            - name: TOOL_NAMESPACE
              value: default
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-chat
  namespace: web-chat
  labels:
    app.kubernetes.io/name: web-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-chat
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-chat
  namespace: web-chat
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: web-chat-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-chat
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-chat
  namespace: web-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-chat
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              kaito.sh/workspace: workspace-nemotron-3-nano-4b
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.1.209/32
      ports:
        - protocol: TCP
          port: 6443
