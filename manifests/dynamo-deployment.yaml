apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo
  namespace: ${DYNAMO_NAMESPACE}
spec:
  replicas: 1
  # Single GPU on this node - see the note in hf-model-deployment.yaml. A rolling update would
  # leave the replacement pod Pending forever behind the outgoing pod's GPU claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dynamo
  template:
    metadata:
      labels:
        app: dynamo
    spec:
      containers:
        - name: dynamo
          image: ${DYNAMO_IMAGE}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              # The image runs as uid 1000 (dynamo); /var/log is root-owned, so log to /tmp.
              python3 -m dynamo.frontend --http-port 8000 --discovery-backend file > /tmp/dynamo-frontend.log 2>&1 &
              # vLLM's engine parser takes --model; --model-path is rejected by this runtime.
              python3 -m dynamo.vllm --model "${DYNAMO_MODEL_ID}" --discovery-backend file
          env:
            # Without this the hub cache lands in the container's ephemeral layer and every
            # restart re-downloads the weights. HF_HOME moves it onto the PVC below.
            - name: HF_HOME
              value: /model-cache
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: dynamo-model-cache
---
# local-path is a bind mount on the node, so the size is advisory rather than enforced.
# Node-local is what we want here: weights are large sequential reads feeding the GPU.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamo-model-cache
  namespace: ${DYNAMO_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: ${MODEL_CACHE_SIZE}
