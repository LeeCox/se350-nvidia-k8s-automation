apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo
  namespace: ${DYNAMO_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo
  template:
    metadata:
      labels:
        app: dynamo
    spec:
      containers:
        - name: dynamo
          image: ${DYNAMO_IMAGE}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              # The image runs as uid 1000 (dynamo); /var/log is root-owned, so log to /tmp.
              python3 -m dynamo.frontend --http-port 8000 --discovery-backend file > /tmp/dynamo-frontend.log 2>&1 &
              # vLLM's engine parser takes --model; --model-path is rejected by this runtime.
              python3 -m dynamo.vllm --model "${DYNAMO_MODEL_ID}" --discovery-backend file
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
