apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-model
  namespace: ${HF_NAMESPACE}
spec:
  replicas: 1
  # The node has one GPU, so a rolling update deadlocks: maxUnavailable rounds down to 0 at one
  # replica, so the old pod keeps the GPU while the new one waits for a GPU that never frees.
  # WaitForFirstConsumer then leaves the PVC Pending too, since it binds on pod scheduling.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hf-model
  template:
    metadata:
      labels:
        app: hf-model
    spec:
      containers:
        - name: tgi
          image: ${TGI_IMAGE}
          env:
            - name: MODEL_ID
              value: "${HF_MODEL_ID}"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: token
          # The image already sets HF_HOME=/data, so mounting the PVC there persists the hub
          # cache across restarts instead of re-pulling several GB into the ephemeral layer.
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-model-cache
---
# Separate claim from the Dynamo one: the two runtimes lay out their caches differently
# (TGI adds an xet store alongside hub/), so they should not share a directory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-model-cache
  namespace: ${HF_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: ${MODEL_CACHE_SIZE}
